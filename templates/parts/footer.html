{% load static %}

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark" id="deleteModalLabel">Confirm Deletion</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body text-center py-4">
                <div class="mb-3">
                    <i class="bi bi-exclamation-octagon text-danger" style="font-size: 3rem;"></i>
                    <div class="modal-body text-center py-4">
                        <h5 class="fw-bold mb-3">Are you sure?</h5>

                        <p class="mb-2">
                            You are about to delete: <span id="recordName" class="fw-bold text-danger"></span>
                        </p>

                        <p class="text-muted small mb-0">
                            You won't be able to recover this data later.
                        </p>
                    </div>

                    <div class="modal-footer border-0 d-flex justify-content-center pb-4">
                        <form id="deleteForm" method="POST" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger px-4 py-2 fw-bold rounded-pill shadow-sm">
                                Yes, Delete Record
                            </button>
                        </form>
                        <button type="button" class="btn btn-light px-4 py-2 fw-bold rounded-pill shadow-sm border"
                            data-bs-dismiss="modal">
                            Keep it
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script src="{% static 'JS/jquery-3.6.0.min.js' %}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'JS/custom.js' %}"></script>
        <script src="{% static 'js/main.js' %}"></script>
